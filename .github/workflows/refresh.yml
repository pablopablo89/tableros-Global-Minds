name: Refrescar datos NODS
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Regenerar snapshots desde la API de NODS
        env:
          NODS_API_KEY: ${{ secrets.NODS_API_KEY }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/refresh-live.mjs
      - name: Commit y push si cambió
        run: |
          git config user.name "nods-refresh-bot"
          git config user.email "actions@github.com"
          git add public/snapshots
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos NODS actualizados"
            git push
          fi
