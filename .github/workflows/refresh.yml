name: Refrescar datos NODS

# Corre todos los días (y se puede disparar a mano desde la pestaña Actions).
on:
  schedule:
    # 08:35 UTC = 05:35 Buenos Aires. Se corre a un minuto "raro" (NO :00) a
    # propósito: el minuto en punto es el más congestionado de GitHub Actions y
    # sus corridas quedan encoladas y demoradas 3-6 h. Con un minuto raro el
    # disparo es casi puntual; el adelanto (~1.5 h antes de las 7 am) es colchón
    # por si aún queda algo de demora, así los datos están listos a las 7 am AR.
    - cron: '35 8 * * *'
  workflow_dispatch: {}      # botón "Run workflow" manual

permissions:
  contents: write            # para commitear los snapshots actualizados

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Regenerar snapshots desde la API de NODS
        env:
          NODS_API_KEY: ${{ secrets.NODS_API_KEY }}
          META_FULL: '1'   # baja todos los meses de Meta (series anuales de pauta)
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/refresh-live.mjs

      - name: Commit y push si cambió
        run: |
          git config user.name "nods-refresh-bot"
          git config user.email "actions@github.com"
          git add public/snapshots
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos NODS actualizados ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
